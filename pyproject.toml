[project]
name = "youtube-transcription"
version = "1.0.0"
license = "MIT"
description = "YouTube 動画の音声を Whisper で文字起こしする"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-whisper>=20231117",
    "yt-dlp[default]>=2026.7.4",
]

[tool.uv]
package = false
# openai-whisper のビルドが pkg_resources を使うため、setuptools 82 以降を避ける
build-constraint-dependencies = ["setuptools<82"]
